name: fleet-ops

on:
  pull_request:

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  fleet-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Ensure system Ruby for the token helper test
        run: |
          if [ ! -x /usr/bin/ruby ]; then
            sudo apt-get update
            sudo apt-get install -y ruby
          fi
      - run: go test ./ops/...
      - name: Run portable ops Python tests
        shell: bash
        run: |
          tests=()
          for test_file in ops/test_*.py; do
            # test_launchd_plist.py expects plists configured for the installed M5 checkout.
            if [[ "$test_file" != ops/test_launchd_plist.py ]]; then
              tests+=("$test_file")
            fi
          done
          python -m unittest "${tests[@]}"
      - run: node --test ops/*.test.mjs
      - run: python ops/fleetctl.py check
      # The Mac fleet monitor's LaunchAgent runs Apple's /usr/bin/python3 (3.9), so run its tests there.
      - uses: actions/setup-python@v5
        id: python39
        with:
          python-version: "3.9"
      - name: Run the fleet monitor tests on Python 3.9
        run: >-
          "${{ steps.python39.outputs.python-path }}" -m unittest
          ops/test_fleet_monitor.py ops/test_fleet_quota_chart.py ops/test_fleetctl.py
