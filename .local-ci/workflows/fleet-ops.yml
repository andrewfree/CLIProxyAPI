name: fleet-ops

on:
  pull_request:

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  fleet-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install PyYAML
      - run: go test ./ops/...
      - run: python -m unittest ops.test_fleetctl ops.test_will_instance ops.test_fleet_routing
      - run: node --test ops/*.test.mjs
      - run: python ops/fleetctl.py check
